[project]
name = "personal-web-research-agent-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohitbista", email = "114638542+Rohitbista@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pytz>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
personal-web-research-agent-lite = "personal_web_research_agent_lite.app.server:main"

[tool.fastapi]
entrypoint = "personal_web_research_agent_lite.app.server:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
