<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Research Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="auth" hidden></main>

<div id="app" hidden>
  <aside id="side">
    <div class="side-top">
      <button class="btn primary block" id="newBtn">New research</button>
      <input id="search" type="search" placeholder="Search your research" aria-label="Search research">
    </div>
    <ul id="jobs"></ul>
    <button class="btn ghost block" id="more" hidden>Load more</button>
  </aside>
  <div id="scrim"></div>
  <section id="main">
    <header>
      <button class="icon" id="menu" aria-label="Open research list">☰</button>
      <h1>Web Research Agent</h1>
      <span class="grow"></span>
      <button class="btn ghost" id="setBtn">LLM settings</button>
      <button class="btn ghost" id="outBtn">Log out</button>
    </header>
    <div id="view"></div>
  </section>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
